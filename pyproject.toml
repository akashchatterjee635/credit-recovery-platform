[build-system]
requires = ["setuptools>=83.0.0,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-recovery-platform"
version = "0.1.0"
description = "Versioned credit-risk, recourse, and recovery evaluation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.141.1,<0.142",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "sqlalchemy>=2.0,<3",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
static = ["dice-ml>=0.11,<1", "lightgbm>=4.3,<5", "shap>=0.45,<1"]
deep = ["torch>=2.2,<3"]
ui = ["streamlit>=1.32,<2"]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.9,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["backend*", "experiments*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: API and database integration tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
